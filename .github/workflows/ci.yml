name: CI
# Disclaimer: AI-generated file
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      run: dotnet restore ETLEngine/ETLEngine.slnx

    - name: Build
      run: dotnet build ETLEngine/ETLEngine.slnx --no-restore

    - name: Test
      run: dotnet test ETLEngine/ETLEngine.slnx --no-build --verbosity normal --collect:"XPlat Code Coverage"

    - name: ReportGenerator
      uses: danielpalme/ReportGenerator-GitHub-Action@v5.4.3
      with:
        reports: 'ETLEngine/ETLEngineTests/TestResults/**/coverage.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'Badges;MarkdownSummaryGithub'

    - name: Write to Job Summary
      run: cat coveragereport/SummaryGithub.md >> $GITHUB_STEP_SUMMARY

    - name: Update Coverage Badge
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        mkdir -p badges
        cp coveragereport/badge_linecoverage.svg badges/coverage.svg
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add badges/coverage.svg
        git commit -m "Update coverage badge" || echo "No changes to commit"
        git push

    - name: Publish Test Results
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: ETLEngine/ETLEngineTests/TestResults/
